# Shared defaults for all scenarios. Scenario files override only what differs.
geoclaw:
  storm: matthew
  drag: garratt
  # 0.0 since the 2026-08-17 rebuild. GeoClaw runs once and returns the pure surge residual;
  # the tide is superposed in the .bdy by build_bdy. Putting the tide in the datum offset eta
  # in every fort.q and made the surge unreadable as an anomaly. savannah_matthew_LR keeps
  # 0.81 as the historical static-tide comparison.
  sea_level: 0.0
  # Level 6 (~145 m) is the production level. Level 7 (~36 m) forced across the whole gauge
  # box was measured at 1.5% of the 72 h run in 5 wall hours, projecting to 13.6 days: each
  # level refines in x, y AND t, so level 7 is 64x level 6 over the same area.
  #
  # 100 m gauge spacing does NOT require level 7. Adjacent gauges do share a 145 m cell, but
  # repetition is not error: the surge offshore is smooth at scales of km, and the gauges sit
  # on the open-water front, not inside the sounds. The 100 m spacing exists because the .bci
  # point sources do not force the cells between them, which is a LISFLOOD requirement, not a
  # GeoClaw resolution one. savannah_matthew_compound_l7 is the convergence test.
  amr_max: 6
coupling:
  gauge_spacing_m: 100      # 100 m needs GeoClaw level 7; at level 6 (~145 m)
                            # adjacent gauges share a cell and repeat each other
  seaward_cells: 3
  datum_offset_m: 0.071
  dry_thresh: 0.05
  landfall_s: 172800        # bdy time-shift origin (so series starts at 0)
# Tidal datums at Fort Pulaski (NOAA 8670870), m NAVD88. Computed from the 2016 6-minute
# CO-OPS record with the Matthew week (5-12 Oct) excluded: tidal extrema at least 10 h apart,
# averaged. 707 high waters, 1.93/day.
#
# The published NTDE 1983-2001 values are MHW +0.938, MSL -0.071, MLW -1.170. That epoch is
# centred on 1992, so it describes a sea level 0.08-0.18 m below the event. Contemporary years
# give MHW 1.104 (2014), 1.109 (2015), 1.114 (2016), 1.071 (2017), 1.068 (2018), so 2016 is
# representative rather than anomalous.
#
# This is the WATERLINE, used for roughness classification, the shoreline contour the seaward
# front follows, and the marsh migration band. geoclaw.sea_level is the run DATUM and is 0.0.
datums:
  station: "8670870"
  mhw: 1.114
  msl: 0.074
  mlw: -1.091
  source: "2016 observed, CO-OPS 6-min, Matthew week excluded"
manning:
  source: nlcd2016
  water_level: null         # null -> datums.mhw
lisflood:
  saveint: 1800
  sim_window_h: [-24, 24]   # relative to landfall
  initial_tstep: 10.0
forcing:
  rainfall: null        # null = surge-only; set to a source (e.g. aorc) for compound
  rain_mode: uniform    # uniform (rainfile) | dynamic (dynamicrainfile netCDF)
  infiltration: null    # null = off; polaris = POLARIS-soil distributed infiltration
  infil_capped: true    # storage-limited (AWC) infiltration -> needs the patched lisflood
  slr_m: 0.0
hpc:
  account: gts-arobel3-atlas
  partition: cpu-medium
  lisflood_bin: /storage/home/hcoda1/6/smurugan9/data/software/LISFLOOD-FP-trunk/lisflood
  # The binary is dynamically linked against these; compute nodes start with a clean module env.
  modules: gcc/12.3.0 netcdf-c/4.9.2-gszew36
  # Only the flux loop in fp_acc.cpp is threaded and part of it sits in `omp critical`, so this
  # saturates well before 24. Benchmark on the smoke test and set it at the knee; throughput
  # comes from running more members concurrently, not from more threads per member.
  cpus_per_task: 8
  mem: 4G                 # per task, not per cpu. Measured MaxRSS is 685 MB on the 30 m grid;
                          # a smaller request backfills into idle slots far more readily.
  walltime: 04:00:00      # A member runs in 31 min when a handful run at once, but at 325-way
                          # concurrency 41% of members exceeded 90 min and were killed. Size
                          # walltime from behaviour at full concurrency, not from a smoke test:
                          # a few members contend for nothing, hundreds contend for scratch I/O.
  throttle: 50            # concurrent array members. The member count drives the ensemble's
                          # value and the throttle drives its wall time, so raise this before
                          # cutting realisations. Check the account limit before going higher.
