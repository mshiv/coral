# 4 m Pin Point high-res, nested in the 30 m compound run. Running at 4 m with floored
# bathymetry and a trimmed surge window makes it actually run: LISFLOOD's timestep is
# CFL*dx/sqrt(g*h), so deep tidal channels (to 10.6 m at 2 m) collapse it. 4 m + DEM
# floored at -1 m + an 18 h window is ~50x faster. See docs/adaptation_sampling_plan.md.
name: pinpoint_highres_4m
domain:
  dem:   data/raw/coned_pinpoint_4m_floored.asc   # CoNED resampled to 4 m, floored at -1 m
  bbox:  [-81.1103, -81.0727, 31.9367, 31.9690]
  res_m: 4
  ref_point: [-81.0903, 31.9522]
coupling:
  landfall_utc: "2016-10-08T06:00:00"
  landfall_s: 172800
lisflood:
  sim_window_h: [-6, 12]                # ~18 h around landfall (surge peak), not the full 48 h
forcing:
  rainfall: aorc
  rain_mode: uniform
  infiltration: polaris
  infil_capped: true
# Decision ensemble on the 4 m grid. Small and targeted rather than broad: these runs answer
# the site-specific adaptation question for Pin Point, so every intervention is sited by the
# same flood-depth-ranked rule the community-facing results use, not by random placement.
#
# ORDER MATTERS. `flood_depth` is the 4 m baseline run's own .max, so the single baseline run
# in Phase 4 must finish before this ensemble can be built. It cannot borrow the 30 m .max:
# targeted siting indexes the depth array with DEM-shaped masks, and sweep now refuses a
# flood_depth grid whose ncols/nrows differ from the DEM.
#   export PP4=$SCR/runs/pinpoint_highres_4m         # the finished 4 m baseline
#   python -m coral.emulator.sweep --base $PP4 --out runs/pp4_decision \
#       --config configs/scenarios/pinpoint_highres_4m.yaml --nlcd data/raw/nlcd_pinpoint.tif
interventions:
  kinds: [marsh, living_shoreline, seawall, depave, retreat]
  slr_levels: [0.0]
  slr_scenarios: [["Int", 2050], ["Int", 2070], ["Int", 2100], ["IntHigh", 2100], ["High", 2100]]
  n_per_kind: 25                 # 6 SLR levels x (1 baseline + 5 kinds x 25) = 756 runs
  include_combos: false
  focus_radius_km: 3.0           # tight around Pin Point, matching the validation ensemble
  seed: 7
  siting: targeted
  flood_depth: ${PP4}/results_full/res_pinpoint_highres_4m.max
  wetlands:      data/raw/sagis_pinpoint/sagis_wetlands_nwi.geojson
  soils_geojson: data/raw/sagis_pinpoint/sagis_soils_nrcs.geojson
  ssurgo_table:  data/raw/ssurgo_pinpoint/ksat_awc_by_mukey.json
  buildings:     data/raw/sagis_pinpoint/fema_structures_pinpoint.geojson
