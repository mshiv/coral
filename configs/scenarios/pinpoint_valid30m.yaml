# Held-out validation ensemble (30 m), same base run as pinpoint_train30m.yaml. Training
# samples random intervention placements for breadth; this ensemble instead sites every
# intervention with the targeted, flood-depth-ranked placement rule used for the real
# decision runs. It tests whether the emulator, trained only on random placements,
# generalizes to the realistic targeted placements it will actually be evaluated against.
# `interventions.flood_depth` must point at a baseline .max path before use -- targeted
# siting ranks candidate cells by flood depth there and there is no default.
#   python -m coral.emulator.sweep --base <30m_compound_run> --out runs/valid30m \
#       --config configs/scenarios/pinpoint_valid30m.yaml --nlcd data/raw/nlcd_savannah.tif
name: pinpoint_valid30m
domain:
  dem:   data/raw/coned_pinpoint_2m.asc            # informational; sweep uses the base run's DEM
  bbox:  [-81.22, -80.82, 31.82, 32.08]
  ref_point: [-81.0903, 31.9522]
interventions:
  kinds: [marsh, living_shoreline, seawall, depave, retreat]
  slr_levels: [0.0]                    # present day
  slr_scenarios: [["Int", 2100]]
  n_per_kind: 2                  # 1 SLR level x (1 baseline + 5 kinds x 2) = 11 runs
  include_combos: false
  focus_radius_km: 3.0           # tight around Pin Point, matching the decision runs
  seed: 99                       # different seed from pinpoint_train30m.yaml (held out)
  siting: targeted                # realistic, flood-depth-ranked placement
  flood_depth: null                # REQUIRED: set to a baseline .max path before use
  # SAGIS context for the placement zones (marsh->NWI, de-pave->impervious, retreat->buildings)
  wetlands:      data/raw/sagis_savannah/sagis_wetlands_nwi.geojson
  soils_geojson: data/raw/sagis_savannah/sagis_soils_nrcs.geojson
  ssurgo_table:  data/raw/ssurgo_savannah/ksat_awc_by_mukey.json
  buildings:     data/raw/sagis_pinpoint/fema_structures_pinpoint.geojson
