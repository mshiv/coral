# The no-rain arm of the compound attribution ladder.
#
# Identical to savannah_matthew_compound_tide except that rainfall is off. Infiltration stays on,
# so the soil still has its conductivity and storage; what is removed is the water falling on the
# surface. The difference between the two runs is therefore the rainfall contribution, which is
# the compound claim and what the AORC work, the POLARIS infiltration and the AWC storage cap are
# there to support.
#
# The ladder this completes:
#   surge + time-varying tide              this run
#   surge + time-varying tide + rain       savannah_matthew_compound_tide
#   surge + static tide + rain             savannah_matthew_compound_statictide
#
# Rain and surge did not coincide at Savannah. AORC peaks at model t = 133200, eleven hours before
# landfall, so Matthew was a sequence rather than a simultaneity: rain first, onto ground that then
# had less storage left when the surge arrived. That is what this arm is meant to quantify.
#
# Boundary architecture is the same as the other arms: interior point sources plus open-ocean edge
# segments, primed with a startfile. Without the edges a tided domain has no outlet and does not
# conserve mass.
name: savannah_matthew_tide_norain
domain:
  dem:   data/raw/ga_cudem_30m.tif
  bbox:  [-81.22, -80.82, 31.70, 32.25]
  res_m: 30
  ref_point: [-81.0903, 31.9522]
geoclaw:
  refine_box: [-81.150, -80.800, 31.680, 32.244]
lisflood:
  startfile: start_savannah_matthew_tide_norain.asc
coupling:
  landfall_utc: "2016-10-08T13:00:00"
forcing:
  tide: noaa
  tide_station: "8670870"
  infiltration: polaris
  infil_capped: true
  mask_saturated_wetland: false
