# The baseline arm of the compound attribution ladder: tide alone.
#
# No storm surge and no rainfall. This is the reference state the other three arms are
# differenced against, and it is what makes N a true second difference rather than an
# assumption that the no-driver state is dry. On a marsh platform that sits close to the
# high-tide plane it is emphatically not dry, so omitting this arm and treating zero as the
# baseline would bias the residual by whatever the tide alone puts on the ground.
name: savannah_matthew_tide_baseline
domain:
  dem:   data/raw/ga_cudem_30m.tif
  bbox:  [-81.22, -80.82, 31.70, 32.25]
  res_m: 30
  ref_point: [-81.0903, 31.9522]
geoclaw:
  refine_box: [-81.150, -80.800, 31.680, 32.244]
lisflood:
  startfile: start_savannah_matthew_tide_baseline.asc
coupling:
  landfall_utc: "2016-10-08T13:00:00"
  surge_scale: 0.0        # tide-only boundary; the GeoClaw residual is dropped
forcing:
  tide: noaa
  tide_station: "8670870"
  infiltration: polaris
  infil_capped: true
  mask_saturated_wetland: false
