# Phase-1 emulator training ensemble (30 m, reuses the Matthew surge, ~10 min/run).
# Intervention-space sampling, Pin Point-clustered, physically plausible: many random-placement
# realizations per intervention across the plausible knob ranges (marsh n spans the Spartina
# vegetation spectrum). This samples the intervention space for training breadth; targeted
# runs are a separate small set for decision realism. See docs/adaptation_sampling_plan.md.
#   python -m coral.emulator.sweep --base <30m_compound_run> --out runs/train30m \
#       --config configs/scenarios/pinpoint_train30m.yaml --nlcd data/raw/nlcd_savannah.tif
name: pinpoint_train30m
domain:
  dem:   data/raw/coned_pinpoint_2m.asc            # informational; sweep uses the base run's DEM
  bbox:  [-81.22, -80.82, 31.82, 32.08]
  ref_point: [-81.0903, 31.9522]
interventions:
  kinds: [marsh, living_shoreline, seawall, depave, retreat]
  slr_levels: [0.0]                    # present day
  slr_scenarios: [["Int", 2050], ["Int", 2070], ["Int", 2100], ["IntHigh", 2100], ["High", 2100]]
  #  2022 Interagency SLR Task Force report, Fort Pulaski, baseline-corrected to the 2016
  #  Matthew surge boundary (see preprocess/fetch_slr.py): Int2050 0.3005, Int2070 0.5395,
  #  Int2100 1.0975, IntHigh2100 1.5445, High2100 2.0425 m. With the 0.0 baseline this spans
  #  0 to ~2 m in roughly even steps, which is what the emulator needs to learn the SLR
  #  response; intermediate values are obtained by evaluating the trained emulator, which
  #  is free.
  n_per_kind: 50             # 6 SLR levels x (1 baseline + 5 kinds x 50) = 1506 runs
  #  A realization redraws both the placement (Gaussian random field seed) and the intensity
  #  knobs (area_frac, n_target, ksat_rate, corr_len), so each is a distinct scenario rather
  #  than the same patch moved. 50 is the starting point: train on it, plot skill against
  #  training-set size, and only go to 100 (3006 runs, about 25 h and 272 GB) if the learning
  #  curve is still climbing.
  include_combos: false
  focus_radius_km: 10.0       # wide context: training wants diversity across several marsh
  #  communities, not just Pin Point, so the emulator sees varied placement contexts. The
  #  targeted decision runs (pinpoint_valid30m.yaml and the 4 m decision ensemble) stay at
  #  3 km, tight around Pin Point, because those runs are asking a site-specific question.
  seed: 0
  siting: random                 # random placement = training breadth (targeted = separate set)
  # SAGIS context for the placement zones (marsh->NWI, de-pave->impervious, retreat->buildings)
  wetlands:      data/raw/sagis_savannah/sagis_wetlands_nwi.geojson
  soils_geojson: data/raw/sagis_savannah/sagis_soils_nrcs.geojson
  ssurgo_table:  data/raw/ssurgo_savannah/ksat_awc_by_mukey.json
  buildings:     data/raw/sagis_pinpoint/fema_structures_pinpoint.geojson
