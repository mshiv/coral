# Matthew 2016 over Savannah — compound with MRMS radar QPE rainfall (dynamic).
# Same as the compound scenario but swaps AORC for MRMS GaugeCorr_QPE_01H and uses DYNAMIC
# (spatial) rainfall. Dynamic rain needs the recompiled LISFLOOD with the rain.tpp SGC fix.
#
# The two products are both about 1 km hourly -- AORC v1.1 is served from the
# noaa-nws-aorc-v1-1-1km bucket, not the 4 km v1.0 -- so this is a comparison of method
# (radar-primary with gauge correction, against gauge-conditioned reanalysis) rather than of
# resolution.
name: savannah_matthew_mrms
domain:
  dem:   data/raw/ga_cudem_30m.tif
  bbox:  [-81.22, -80.82, 31.70, 32.25]
  res_m: 30
  ref_point: [-81.0903, 31.9522]
geoclaw:
  refine_box: [-81.150, -80.800, 31.680, 32.244]
coupling:
  landfall_utc: "2016-10-08T13:00:00"
forcing:
  rainfall: mrms        # MRMS GaugeCorr_QPE_01H (IEM archive) instead of AORC
  rain_mode: dynamic    # spatial netCDF rainfall (needs the rain.tpp-fixed binary)
  infiltration: polaris
  infil_capped: true
