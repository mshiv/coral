# Matthew 2016 over Savannah — compound with MRMS radar QPE rainfall (dynamic).
# Same as the compound scenario but swaps AORC for MRMS GaugeCorr_QPE_01H (radar+gauge,
# ~1 km, hourly; captures rainband structure AORC smooths) and uses DYNAMIC (spatial)
# rainfall. Dynamic rain needs the recompiled LISFLOOD with the rain.tpp SGC fix.
name: savannah_matthew_mrms
domain:
  dem:   data/raw/ga_cudem_30m.asc
  bbox:  [-81.22, -80.82, 31.82, 32.08]
  res_m: 30
  ref_point: [-81.137, 31.944]
geoclaw:
  refine_box: [-81.111, -80.819, 31.804, 32.100]
coupling:
  landfall_utc: "2016-10-08T06:00:00"
forcing:
  rainfall: mrms        # MRMS GaugeCorr_QPE_01H (IEM archive) instead of AORC
  rain_mode: dynamic    # spatial netCDF rainfall (needs the rain.tpp-fixed binary)
  infiltration: polaris
  infil_capped: true
