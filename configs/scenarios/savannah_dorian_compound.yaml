# Hurricane Dorian (2019) at Savannah, using the same domain, AMR ladder, coupling front,
# terrain and LISFLOOD physics as the Matthew production chain.  This first scenario builds
# the GeoClaw surge boundary.  Dorian AORC rainfall and the event-specific tide are fetched
# separately before rendering the final compound LISFLOOD run.
name: savannah_dorian_compound
domain:
  dem: data/raw/ga_cudem_30m.tif
  bbox: [-81.22, -80.82, 31.70, 32.25]
  res_m: 30
  ref_point: [-81.0903, 31.9522]
geoclaw:
  storm: dorian
  sea_level: 0.0
  amr_max: 6
  refine_box: [-81.150, -80.800, 31.680, 32.244]
coupling:
  # Matches the GeoClaw Dorian reference used by the surge-examples case.
  landfall_utc: "2019-09-04T12:00:00"
forcing:
  tide: noaa
  tide_station: "8670870"
  rainfall: aorc
  rain_mode: uniform
  infiltration: polaris
  infil_capped: true
